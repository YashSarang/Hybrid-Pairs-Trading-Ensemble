    - "TITAN.NS"
    - "BAJFINANCE.NS"
    - "ONGC.NS"
    - "M&M.NS"
    - "TATASTEEL.NS"
    - "ADANIENT.NS"
    - "IOC.NS"
    - "BPCL.NS"
