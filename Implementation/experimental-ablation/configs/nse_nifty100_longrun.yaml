data:
  start_date: "2004-01-01"
  end_date: "2024-12-31"
  frequency: "1d"
  source: "yfinance"
  cache_dir: "experimental-ablation/data/nse_nifty100_longrun"

costs:
  brokerage_bps: 3.0
  exchange_bps: 0.345
  sebi_bps: 0.01
  stt_bps: 10.0
  gst_rate: 0.18
  stamp_bps: 1.0
  slippage_bps: 2.0

backtest:
  initial_capital: 10000000
  max_concurrent_pairs: 10
  per_trade_notional: 500000
  hold_period_days: 20

selectors:
  weights:
    correlation: 0.25
    distance: 0.25
    cointegration: 0.25
    combined: 0.25

signals:
  weights:
    zscore: 1.0

walk_forward:
  n_folds: 16
  train_months: 12
  test_months: 12
  type: rolling

random_seed: 42
