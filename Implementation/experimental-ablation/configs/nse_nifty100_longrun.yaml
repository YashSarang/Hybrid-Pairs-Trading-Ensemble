# NSE Nifty 100 Long-Run Configuration (2004-2024)
# Broader universe: 31 Nifty 50 blue-chips + 16 mid-cap Nifty 100 tickers = 47 tickers
# Paired control for universe quality comparison against nse_nifty50_longrun

