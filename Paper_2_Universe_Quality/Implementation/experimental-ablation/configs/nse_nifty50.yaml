# NSE Nifty 50 Configuration (CONTROL EXPERIMENT)
# This is the missing control to test universe quality vs geography
# Compare: NSE Nifty 100 (baseline) vs NSE Nifty 50 (this config) vs India Multi-Market (Nifty 50 from other exchanges)

market:
  name: "NSE_Nifty50"
  code: "NSE"
  currency: "INR"
  timezone: "Asia/Kolkata"

universe:
  # Same 35 tickers as experimental-ablation/configs/india.yaml
  # But explicitly labeled as NSE (not "multi-market India")
  tickers:
    - "RELIANCE.NS"
    - "TCS.NS"
    - "HDFCBANK.NS"
    - "INFY.NS"
    - "ICICIBANK.NS"
    - "HINDUNILVR.NS"
    - "ITC.NS"
    - "SBIN.NS"
    - "BHARTIARTL.NS"
    - "KOTAKBANK.NS"
    - "LT.NS"
    - "AXISBANK.NS"
    - "ASIANPAINT.NS"
    - "MARUTI.NS"
    - "HCLTECH.NS"
    - "WIPRO.NS"
    - "ULTRACEMCO.NS"
    - "SUNPHARMA.NS"
    - "NESTLEIND.NS"
    - "TITAN.NS"
    - "BAJFINANCE.NS"
    - "ONGC.NS"
    - "NTPC.NS"
    - "POWERGRID.NS"
    - "M&M.NS"
    - "TATAMOTORS.NS"
    - "TATASTEEL.NS"
    - "TECHM.NS"
    - "ADANIENT.NS"
    - "COALINDIA.NS"
    - "IOC.NS"
    - "BPCL.NS"
    - "GRASIM.NS"
    - "HINDALCO.NS"
    - "JSWSTEEL.NS"

  sectors:
    IT: ["TCS.NS", "INFY.NS", "HCLTECH.NS", "WIPRO.NS", "TECHM.NS"]
    Banking: ["HDFCBANK.NS", "ICICIBANK.NS", "SBIN.NS", "AXISBANK.NS", "KOTAKBANK.NS"]
    Energy: ["RELIANCE.NS", "ONGC.NS", "IOC.NS", "BPCL.NS"]
    Auto: ["MARUTI.NS", "M&M.NS", "TATAMOTORS.NS"]
    Pharma: ["SUNPHARMA.NS"]
    FMCG: ["HINDUNILVR.NS", "ITC.NS", "NESTLEIND.NS", "TITAN.NS"]
    Infra: ["LT.NS", "NTPC.NS", "POWERGRID.NS"]
    Metals: ["TATASTEEL.NS", "HINDALCO.NS", "JSWSTEEL.NS", "COALINDIA.NS"]
    Finance: ["BAJFINANCE.NS"]
    Misc: ["BHARTIARTL.NS", "ASIANPAINT.NS", "ULTRACEMCO.NS", "ADANIENT.NS", "GRASIM.NS"]

data:
  start_date: "2020-01-01"
  end_date: "2025-05-01"
  frequency: "1d"
  source: "yfinance"
  cache_dir: "experimental-ablation/data/nse_nifty50"

costs:
  # NSE transaction cost model (same as Nifty 100 for fair comparison)
  brokerage_bps: 3.0
  exchange_bps: 0.345
  sebi_bps: 0.01
  stt_bps: 10.0        # Securities Transaction Tax (sell leg only)
  gst_rate: 0.18       # GST on brokerage + exchange
  stamp_bps: 1.0       # Stamp duty (buy leg only)
  slippage_bps: 2.0
  # Total round-trip: ~16.4 bps (identical to Nifty 100)

backtest:
  initial_capital: 10000000  # 1 Cr INR
  max_concurrent_pairs: 10
  per_trade_notional: 500000  # 5 lakh per leg
  hold_period_days: 20

selectors:
  weights:
    correlation: 0.15
    distance: 0.10
    cointegration: 0.10
    combined: 0.05
    ml: 0.15
    lstm: 0.25
    transformer: 0.10
    gnn: 0.10

signals:
  weights:
    zscore: 0.30
    ou: 0.30
    kalman: 0.25
    ml: 0.15

walk_forward:
  n_folds: 4  # Match multi-market experiments (2021-2024)
  train_months: 12  # Rolling window (optimized methodology)
  test_months: 12

random_seed: 42
